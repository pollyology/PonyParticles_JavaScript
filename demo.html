<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    function openCenteredPopup(url, name, width, height) {
      const screenWidth = window.screen.width;
      const screenHeight = window.screen.height;
      const left = (screenWidth - width) / 2;
      const top = (screenHeight - height) / 2;

      const popup = window.open(
        url,
        name,
        `width=${width},height=${height},left=${left},top=${top},` +
        `resizable=no,scrollbars=no,toolbar=no,menubar=no,status=no,location=no`
      );

      if (!popup) {
        alert("Popup blocked! Please allow popups for this site.");
      } else {
        popup.focus();
      }
    }

    // Automatically opens the demo in a popup window, like an MLP virus (jk)
    window.onload = function() {
      openCenteredPopup('https://pollyology.neocities.org/particles/', 'Particles', 960, 540);
    };
  </script>
</head>
</html>
